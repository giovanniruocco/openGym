name: Build iOS IPA for AltStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build Xcode Archive
        working-directory: frontend/ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi
          if [ -d "App.xcworkspace" ]; then
            xcodebuild archive \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/openGym.xcarchive" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES
          else
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/openGym.xcarchive" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$RUNNER_TEMP/openGym.xcarchive/Products/Applications/App.app" Payload/
          zip -r openGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-ipa
          path: openGym.ipa
